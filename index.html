<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>垃圾山搬家公司</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="hud" aria-live="polite">
      <span class="hud-item">剩餘時間 <strong id="hud-time">60.0</strong></span>
      <span class="hud-item">分數 <strong id="hud-score">0</strong></span>
      <span class="hud-item">拖曳 <strong id="hud-chain">0 / 5</strong></span>
      <span class="hud-item">載重 <strong id="hud-weight">0</strong></span>
    </header>

    <div class="stage">
      <canvas id="game" width="960" height="640" aria-label="遊戲畫面"></canvas>

      <section id="screen-title" class="overlay">
        <div class="panel">
          <h1>垃圾山搬家公司</h1>
          <p class="tag">60 秒內，把垃圾山裡的家具拖進回收站！</p>
          <p class="best-line">歷史最高分：<strong id="title-best">0</strong></p>
          <button id="btn-start" type="button">開始搬家</button>
        </div>
      </section>

      <section id="screen-over" class="overlay hidden">
        <div class="panel">
          <h2>收工！</h2>
          <dl class="result">
            <dt>分數</dt><dd id="over-score">0</dd>
            <dt>交付件數</dt><dd id="over-count">0</dd>
            <dt>歷史最高分</dt><dd id="over-best">0</dd>
          </dl>
          <p id="over-record" class="record hidden">新紀錄！</p>
          <button id="btn-restart" type="button">再玩一次</button>
        </div>
      </section>
    </div>

  </main>

  <footer class="hintbar" aria-label="操作提示">
    <span><kbd>WASD</kbd>／<kbd>方向鍵</kbd> 駕駛</span>
    <span><kbd>空白鍵</kbd> 勾貨（橘圈內，最多 5 件）</span>
    <span>整串都進回收站才交付</span>
    <span>撞牆停住可用方向鍵原地轉</span>
    <span>📦 重1・10分　🛋️ 重3・30分　🧊 重5・60分</span>
  </footer>
  <script src="game.js"></script>
</body>
</html>
